# PR checks: the GitHub Actions version of an Azure Pipelines PR build.
# Runs on every PR into dev/main and on pushes to dev (for the README badge).
name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

# One run per branch/PR; a new push cancels the older run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Pinned to the Flutter the app is built with (see .metadata revision 6a19cca).
  FLUTTER_VERSION: "3.47.5"

jobs:
  checks:
    name: Analyze, format & test
    runs-on: ubuntu-24.04 # pinned: ubuntu-latest moves to 26.04 on 2026-10-19; keeps goldens stable
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false # nothing pushes back; don't leave the token in .git/config

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true # Flutter SDK
          pub-cache: true # ~/.pub-cache

      - name: flutter pub get
        run: flutter pub get

      - name: dart format
        run: dart format --output=none --set-exit-if-changed .

      - name: flutter analyze
        run: flutter analyze

      - name: flutter test (incl. goldens)
        run: flutter test

      - name: Upload golden diffs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: golden-failures
          path: test/failures/
          if-no-files-found: ignore
          retention-days: 7

  debug-apk:
    name: Build debug APK
    needs: checks # like dependsOn between ADO stages: only build if checks pass
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false # nothing pushes back; don't leave the token in .git/config

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle # ~/.gradle caches + wrapper

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          pub-cache: true

      - run: flutter pub get

      - name: flutter build apk --debug
        run: flutter build apk --debug

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: good-pro-portion-debug-${{ github.event.pull_request.head.sha || github.sha }}
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
