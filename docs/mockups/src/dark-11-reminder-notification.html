<!DOCTYPE html>
<html><head><meta charset="utf-8"/>
<style>:root {
  --bg: #F7F8FA;
  --surface: #FFFFFF;
  --surface-2: #EEF1F5;
  --text: #1A1D23;
  --text-2: #5C6570;
  --text-3: #8A939E;
  --accent: #0D9488;
  --accent-soft: #CCFBF1;
  --accent-dark: #0F766E;
  --danger: #E11D48;
  --warn: #F59E0B;
  --ad: #E8ECF1;
  --ad-border: #C5CDD8;
  --radius: 16px;
  --radius-sm: 12px;
  --shadow: 0 2px 8px rgba(26,29,35,0.06);
  --phone-w: 412px;
  --phone-h: 915px;
  --font: "Inter", "Roboto", system-ui, -apple-system, sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  width: var(--phone-w);
  height: var(--phone-h);
  overflow: hidden;
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  -webkit-font-smoothing: antialiased;
}
.phone {
  width: var(--phone-w);
  height: var(--phone-h);
  background: var(--bg);
  display: flex;
  flex-direction: column;
  position: relative;
}
.status-bar {
  height: 36px;
  padding: 8px 20px 0;
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 13px;
  font-weight: 600;
  color: var(--text);
  flex-shrink: 0;
}
.status-icons { display: flex; gap: 6px; align-items: center; opacity: 0.85; font-size: 12px; }
.nav-bar {
  height: 28px;
  display: flex;
  justify-content: center;
  align-items: center;
  flex-shrink: 0;
}
.nav-pill { width: 108px; height: 4px; background: #1A1D23; border-radius: 4px; opacity: 0.35; }
.content {
  flex: 1;
  overflow: hidden;
  padding: 8px 20px 12px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
h1 { font-size: 28px; font-weight: 700; letter-spacing: -0.4px; line-height: 1.15; }
h2 { font-size: 20px; font-weight: 700; letter-spacing: -0.2px; }
h3 { font-size: 16px; font-weight: 600; }
.sub { color: var(--text-2); font-size: 14px; line-height: 1.4; }
.muted { color: var(--text-3); font-size: 13px; }
.chip {
  display: inline-flex; align-items: center; gap: 6px;
  background: var(--accent-soft); color: var(--accent-dark);
  font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 999px;
}
.card {
  background: var(--surface);
  border-radius: var(--radius);
  padding: 16px;
  box-shadow: var(--shadow);
  border: 1px solid rgba(26,29,35,0.04);
}
.card.disabled { opacity: 0.45; filter: grayscale(0.3); }
.btn {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  background: var(--accent); color: white; font-weight: 700; font-size: 17px;
  border: none; border-radius: 28px; height: 56px; width: 100%;
  letter-spacing: 0.2px;
}
.btn.secondary {
  background: var(--surface-2); color: var(--text);
}
.btn.ghost {
  background: transparent; color: var(--accent); border: 2px solid var(--accent-soft);
}
.ad-banner {
  background: var(--ad);
  border: 1.5px dashed var(--ad-border);
  border-radius: 12px;
  height: 64px;
  display: flex; align-items: center; justify-content: center;
  color: var(--text-3); font-size: 13px; font-weight: 600;
  letter-spacing: 0.5px; text-transform: uppercase;
  flex-shrink: 0;
  margin: 0 20px 8px;
}
.ad-banner.inline { margin: 0; height: 72px; }
.row { display: flex; align-items: center; gap: 12px; }
.spacer { flex: 1; }
.figure-wrap {
  display: flex; align-items: center; justify-content: center;
  background: var(--accent-soft);
  border-radius: 20px;
}
.figure-wrap svg { display: block; }
.thumb {
  width: 52px; height: 52px; border-radius: 12px;
  background: var(--accent-soft);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.thumb svg { width: 40px; height: 40px; }
.list-item {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 0;
  border-bottom: 1px solid rgba(26,29,35,0.06);
}
.list-item:last-child { border-bottom: none; }
.badge {
  font-size: 11px; font-weight: 700; color: var(--accent-dark);
  background: var(--accent-soft); padding: 2px 8px; border-radius: 6px;
}
.section-label {
  font-size: 12px; font-weight: 700; text-transform: uppercase;
  letter-spacing: 0.6px; color: var(--text-3); margin-bottom: 4px;
}
.example-tag {
  position: absolute; top: 44px; right: 16px;
  background: #FEF3C7; color: #92400E;
  font-size: 10px; font-weight: 700; padding: 3px 8px;
  border-radius: 6px; letter-spacing: 0.3px; z-index: 5;
}

:root {
  --bg: #0F1218;
  --surface: #1A1F2A;
  --surface-2: #252B38;
  --text: #F3F4F6;
  --text-2: #A0A8B5;
  --text-3: #6B7280;
  --accent: #FF6B4A;
  --accent-soft: #3A221C;
  --accent-dark: #FF8A70;
  --ad: #1F2530;
  --ad-border: #3A4250;
  --danger: #FB7185;
}
.nav-pill { background: #F3F4F6; opacity: 0.4; }
.card { border-color: rgba(255,255,255,0.04); box-shadow: 0 2px 8px rgba(0,0,0,0.25); }
.btn.secondary { background: var(--surface-2); color: var(--text); }
.btn.ghost { border-color: #4A2E28; color: var(--accent); }
.example-tag { background: #3A2E14; color: #FBBF24; }

.phone { background: #0A0C10 !important; }
.nav-pill { background: #fff; opacity: 0.35; }
</style>
</head><body>
<div class="phone" style="background:#0A0C10;">
  <div style="padding:48px 24px 0;color:#fff;text-align:center;">
    <div style="font-size:14px;opacity:0.7;letter-spacing:1px;">THURSDAY 24 SEP</div>
    <div style="font-size:72px;font-weight:200;letter-spacing:-2px;line-height:1.1;margin-top:4px;">6:30</div>
  </div>
  <div class="example-tag" style="position:absolute;top:12px;right:16px;">EXAMPLE MOCKUP</div>
  <div style="padding:28px 16px 0;">
    <div style="background:#1A1F2A;border-radius:20px;padding:14px 16px;color:#F3F4F6;box-shadow:0 8px 24px rgba(0,0,0,0.35);">
      <div class="row" style="gap:10px;margin-bottom:8px;">
        <div style="width:28px;height:28px;border-radius:8px;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:14px;">💪</div>
        <div class="spacer">
          <div style="font-size:12px;font-weight:700;opacity:0.85;letter-spacing:0.3px;">GOOD PRO PORTION</div>
          <div style="font-size:11px;opacity:0.5;">now</div>
        </div>
      </div>
      <div style="font-size:16px;font-weight:700;line-height:1.3;">Day B is up. 9 minutes, no gear.</div>
      <div style="font-size:13px;opacity:0.65;margin-top:4px;">Quiet morning · sleeping-kid friendly</div>
      <div style="display:flex;gap:8px;margin-top:14px;">
        <div style="flex:1;text-align:center;padding:10px;border-radius:12px;background:rgba(255,255,255,0.08);font-size:13px;font-weight:700;">Snooze 15 min</div>
        <div style="flex:1;text-align:center;padding:10px;border-radius:12px;background:var(--accent);color:#fff;font-size:13px;font-weight:700;">Start</div>
      </div>
    </div>
  </div>
  <div style="flex:1;"></div>
  <div style="padding:20px;text-align:center;color:rgba(255,255,255,0.35);font-size:12px;">Lock screen · example notification</div>
  <div class="nav-bar"><div class="nav-pill"></div></div>
</div></body></html>
