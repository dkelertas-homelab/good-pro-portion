# Weekly dependency PRs into dev. CI runs on each one like any other PR.
version: 2
updates:
  - package-ecosystem: pub
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Australia/Sydney
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build(deps)"
    groups:
      pub-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Australia/Sydney
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions:
        patterns: ["*"]
